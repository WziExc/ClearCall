// ClearCall — App 级构建配置
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.clearcall.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.clearcall.app"
        // Android 8.0+ (minSdk 26)
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            // 发布时启用混淆和压缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // ═══════════════════════════════════════════════════════════
    // APK 体积优化（阶段5-5.12）
    // ═══════════════════════════════════════════════════════════

    // 仅构建 arm 架构（排除 x86/x86_64 模拟器架构，减小 APK）
    // 目标：APK < 30MB
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false  // 不生成通用胖 APK
        }
    }

    // 压缩 Native 库
    packagingOptions {
        jniLibs {
            useLegacyPackaging false  // 使用 App Bundle 原生库压缩
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
